name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Sparse-checkout only the site file so the 3.8 GB of audio is never fetched.
      - name: Checkout site files only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index.html
            manifest.json
          sparse-checkout-cone-mode: false

      - name: Stage _site
        run: |
          mkdir -p _site
          cp index.html _site/
          # Same-origin fallback copy; the page normally reads the manifest from
          # raw so new packs appear without waiting for a Pages deploy.
          cp manifest.json _site/ 2>/dev/null || echo "no manifest.json yet"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
