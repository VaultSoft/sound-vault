name: Zip champion SFX packs

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
    paths:
      - 'downloads/**'
  workflow_dispatch:
    inputs:
      packs:
        description: 'Force-rebuild only these packs (comma-separated champion names)'
        type: string
        default: ''
      rebuild_all:
        description: 'Rebuild and re-upload EVERY pack (resets all download counts)'
        type: boolean
        default: false

concurrency:
  group: zip-packs
  cancel-in-progress: false

jobs:
  build-zips:
    runs-on: ubuntu-latest
    env:
      # This job never checks out at the workspace root, so the gh CLI has no
      # git remote to infer the repo from - tell it explicitly.
      GH_REPO: ${{ github.repository }}
    steps:
      # No repo checkout here: the plan (which packs exist, which changed, and the
      # whole manifest) is derived from the git tree + compare APIs, so we never
      # clone the 3.8 GB of audio just to find out nothing changed.
      - name: Plan changed packs and build manifest
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ONLY: ${{ inputs.packs }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, sys, datetime

          REPO   = os.environ["REPO"]
          SHA    = os.environ["SHA"]
          ONLY   = os.environ.get("ONLY", "")
          REBUILD_ALL = os.environ.get("REBUILD_ALL", "") == "true"

          AUDIO = (".mp3", ".ogg")
          RAW      = f"https://raw.githubusercontent.com/{REPO}/main/"
          RELEASE  = f"https://github.com/{REPO}/releases/download/sound-packs/"

          # Loose audio sitting directly in a category folder (not in a champion
          # folder) ships as a single file, with a curated title. Keep these asset
          # names exactly as they are: renaming would orphan live links + counts.
          LOOSE = {
            "downloads/League of Legends Sound Effects/father of draven anthem.mp3":
              {"name": "Father of Draven", "cat": "Anthem", "asset": "father-of-draven-anthem.mp3"},
            "downloads/League of Legends Ambient Sounds/the howling abyss ambient sounds.mp3":
              {"name": "Howling Abyss", "cat": "Ambient", "asset": "howling-abyss-ambient.mp3"},
            "downloads/League of Legends Ambient Sounds/summoners rift ambient sounds.mp3":
              {"name": "Summoner's Rift", "cat": "Ambient", "asset": "summoners-rift-ambient.mp3"},
          }

          def gh(*args):
              # encoding is explicit: champion filenames contain non-ASCII (U+2019
              # apostrophes), which locale-default decoding would mangle.
              out = subprocess.run(["gh", *args], capture_output=True, text=True,
                                   encoding="utf-8")
              if out.returncode != 0:
                  raise RuntimeError(f"gh {' '.join(args)} failed: {out.stderr.strip()}")
              return json.loads(out.stdout or "null")

          def slug(s):
              s = re.sub(r"league of legends", "", s.lower())
              s = re.sub(r"[^a-z0-9]+", "-", s)
              return s.strip("-")

          def catlabel(c):
              s = re.sub(r"(?i)^league of legends", "", c).strip()
              s = s.lstrip("-").strip()
              s = re.sub(r"\s+Sounds$", "", s)
              return s or c

          # ---- 1. Full picture of downloads/ straight from the git tree --------
          tree = gh("api", f"repos/{REPO}/git/trees/{SHA}?recursive=1")
          if tree.get("truncated"):
              # Reconciling deletions against a partial tree could delete live
              # assets, so refuse rather than guess.
              sys.exit("git tree came back truncated - aborting instead of risking asset deletion")

          packs = {}   # key -> pack dict
          for e in tree.get("tree", []):
              if e.get("type") != "blob":
                  continue
              path = e["path"]
              if not path.startswith("downloads/"):
                  continue
              if not path.lower().endswith(AUDIO):
                  continue          # skips cover images and any stray non-audio
              parts = path.split("/")
              if len(parts) < 3:
                  continue
              category, rest = parts[1], parts[2:]

              if len(rest) == 1:                        # loose file in a category
                  meta = LOOSE.get(path)
                  if meta is None:                      # a new loose file
                      stem, ext = os.path.splitext(rest[0])
                      meta = {"name": stem.strip().title(),
                              "cat": catlabel(category),
                              "asset": slug(stem) + ext.lower()}
                  key = ("loose", path)
                  packs[key] = {"name": meta["name"], "cat": meta["cat"],
                                "base": f"downloads/{category}", "asset": meta["asset"],
                                "kind": "file", "items": [[rest[0], e["size"]]]}
              else:                                     # champion folder
                  champ = rest[0]
                  key = ("champ", category, champ)
                  p = packs.setdefault(key, {
                      "name": champ, "cat": catlabel(category),
                      "base": f"downloads/{category}/{champ}",
                      "asset": f"{slug(category)}-{slug(champ)}.zip",
                      "kind": "zip", "items": [],
                  })
                  p["items"].append(["/".join(rest[1:]), e["size"]])

          for p in packs.values():
              p["items"].sort(key=lambda i: i[0].lower())
              p["n"] = len(p["items"])
              p["bytes"] = sum(i[1] for i in p["items"])
              # Fingerprint of exactly what belongs in this pack. Comparing it
              # against the last published manifest is what decides a rebuild,
              # so a cancelled or failed run can never leave a zip stale.
              p["fp"] = hashlib.sha1(
                  json.dumps(p["items"], ensure_ascii=False, sort_keys=True).encode("utf-8")
              ).hexdigest()[:12]

          ordered = sorted(packs.values(), key=lambda p: (p["name"].lower(), p["cat"]))
          print(f"{len(ordered)} packs, {sum(p['n'] for p in ordered)} audio files")

          # ---- 2. Which packs actually changed --------------------------------
          try:
              rel = gh("api", f"repos/{REPO}/releases/tags/sound-packs")
              existing = {a["name"] for a in rel.get("assets", [])}
          except Exception:
              existing = set()          # release not created yet - first run
          print(f"{len(existing)} asset(s) currently on the release")

          # Fingerprints from the last published manifest. This - not the push
          # diff - is what decides a rebuild: it stays correct across cancelled
          # runs, failed runs, manual asset deletion and force-pushes.
          prev_fp = {}
          try:
              blob = gh("api", f"repos/{REPO}/contents/manifest.json")
              prev = json.loads(base64.b64decode(blob["content"]).decode("utf-8"))
              prev_fp = {p["asset"]: p.get("fp") for p in prev.get("packs", [])}
              print(f"previous manifest has {len(prev_fp)} pack(s), "
                    f"{sum(1 for v in prev_fp.values() if v)} with fingerprints")
          except Exception as ex:
              print(f"no previous manifest to compare against ({ex})")

          wanted = {w.strip().lower() for w in ONLY.split(",") if w.strip()}
          changed, why = set(), {}
          for k, p in packs.items():
              a = p["asset"]
              if REBUILD_ALL:
                  changed.add(k); why[a] = "full rebuild"
              elif wanted and (p["name"].lower() in wanted or a.lower() in wanted):
                  changed.add(k); why[a] = "named in packs input"
              elif a not in existing:
                  changed.add(k); why[a] = "no asset published yet"
              elif prev_fp.get(a) is None:
                  # First run after adding fingerprints (or a pack the previous
                  # manifest predates): the asset exists, so trust it rather than
                  # rebuild everything and reset every download count.
                  pass
              elif prev_fp[a] != p["fp"]:
                  changed.add(k); why[a] = "contents changed"

          todo = [packs[k] for k in changed]
          todo.sort(key=lambda p: p["name"].lower())
          print(f"{len(todo)} pack(s) to build:")
          for p in todo:
              print(f"  - {p['name']} [{p['cat']}] -> {p['asset']}  ({why[p['asset']]})")
          if not todo:
              print("  (nothing to rebuild - every published pack matches the tree)")

          # ---- 3. Assets for packs that no longer exist -----------------------
          live_assets = {p["asset"] for p in ordered}
          stale = sorted(a for a in existing
                         if a.endswith(".zip") and a not in live_assets)
          if stale:
              print("stale assets to delete: " + ", ".join(stale))

          # ---- 4. Emit manifest + work lists ----------------------------------
          manifest = {
            "generated": datetime.datetime.now(datetime.timezone.utc)
                          .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
            "commit": SHA,
            "raw": RAW,
            "release": RELEASE,
            "packs": [{k: p[k] for k in ("name", "cat", "base", "asset", "kind", "n", "bytes", "fp", "items")}
                      for p in ordered],
          }
          with open("/tmp/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False, separators=(",", ":"))
              fh.write("\n")

          with open("/tmp/dirs.txt", "w", encoding="utf-8") as fh:
              for p in todo:
                  if p["kind"] == "zip":
                      fh.write(p["base"] + "\n")
          with open("/tmp/todo.json", "w", encoding="utf-8") as fh:
              json.dump(todo, fh, ensure_ascii=False)
          with open("/tmp/stale.txt", "w", encoding="utf-8") as fh:
              for a in stale:
                  fh.write(a + "\n")     # trailing newline: `while read` drops a final unterminated line

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"count={len(todo)}\n")
              fh.write(f"stale={len(stale)}\n")
          PY

      - name: Fetch only the changed champion folders
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/dirs.txt ]; then
            echo "No champion folders to fetch (loose files only)."
            exit 0
          fi
          mkdir -p work && cd work
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config core.sparseCheckout true
          git sparse-checkout init --cone
          git sparse-checkout set --stdin < /tmp/dirs.txt
          # blob:none + sparse cone = only the changed folders' audio is downloaded,
          # instead of the whole 3.8 GB history.
          git fetch -q --depth=1 --filter=blob:none origin "$SHA"
          git checkout -q FETCH_HEAD
          echo "Fetched $(du -sh downloads 2>/dev/null | cut -f1) across $(wc -l < /tmp/dirs.txt) folder(s)."

      - name: Build and upload changed packs
        if: steps.plan.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="sound-packs"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" \
              --title "League of Legends Sound Packs" \
              --notes "Per-champion sound & voice packs, generated automatically from the downloads/ folder. Each asset is one champion's pack."
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, os, subprocess, shutil, urllib.parse, urllib.request
          todo = json.load(open("/tmp/todo.json", encoding="utf-8"))
          repo = os.environ["REPO"]
          for p in todo:
              out = "/tmp/out/" + p["asset"]
              if p["kind"] == "zip":
                  src = os.path.join("work", p["base"])
                  if not os.path.isdir(src):
                      raise SystemExit(f"expected folder missing after sparse checkout: {src}")
                  subprocess.run(["zip", "-qr", "-X", out, ".", "-i", "*.mp3", "*.ogg"],
                                 cwd=src, check=True)
              else:
                  # single loose file: publish it as-is
                  url = ("https://raw.githubusercontent.com/" + repo + "/main/"
                         + urllib.parse.quote(p["base"] + "/" + p["items"][0][0]))
                  with urllib.request.urlopen(url) as r, open(out, "wb") as fh:
                      shutil.copyfileobj(r, fh)
              print(f"  {p['asset']}  <-  {p['name']} [{p['cat']}]")
          PY
          gh release upload "$tag" /tmp/out/* --clobber
          echo "Uploaded $(ls /tmp/out | wc -l) asset(s); every other asset was left untouched."

      - name: Delete assets for packs that no longer exist
        if: steps.plan.outputs.stale != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while IFS= read -r a || [ -n "$a" ]; do
            [ -n "$a" ] || continue
            echo "deleting stale asset: $a"
            gh release delete-asset sound-packs "$a" --yes
            deleted=$((deleted + 1))
          done < /tmp/stale.txt
          if [ "$deleted" -eq 0 ]; then
            echo "expected to delete $(wc -l < /tmp/stale.txt) asset(s) but deleted none" >&2
            exit 1
          fi
          echo "Deleted ${deleted} stale asset(s)."

      - name: Commit manifest.json if it changed
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, subprocess

          repo = os.environ["REPO"]
          new = open("/tmp/manifest.json", "rb").read()

          cur = subprocess.run(["gh", "api", f"repos/{repo}/contents/manifest.json",
                                "--jq", ".sha + \" \" + (.content|gsub(\"\\n\";\"\"))"],
                               capture_output=True, text=True, encoding="utf-8")
          sha = None
          if cur.returncode == 0 and cur.stdout.strip():
              sha, _, b64 = cur.stdout.strip().partition(" ")
              if base64.b64decode(b64) == new:
                  print("manifest.json unchanged - nothing to commit")
                  raise SystemExit(0)

          payload = {"message": "Update manifest.json [skip ci]",
                     "content": base64.b64encode(new).decode(),
                     "branch": "main"}
          if sha:
              payload["sha"] = sha
          open("/tmp/payload.json", "w").write(json.dumps(payload))
          out = subprocess.run(["gh", "api", f"repos/{repo}/contents/manifest.json",
                                "-X", "PUT", "--input", "/tmp/payload.json",
                                "--jq", ".commit.sha"], capture_output=True, text=True)
          if out.returncode != 0:
              raise SystemExit("failed to commit manifest: " + out.stderr)
          print("committed manifest.json as " + out.stdout.strip())
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("committed=1\n")
          PY

      - name: Refresh the Pages copy of the manifest
        if: steps.manifest.outputs.committed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A GITHUB_TOKEN push doesn't trigger other workflows, so nudge Pages
          # directly. The live page reads the manifest from raw either way, so
          # this is only keeping the same-origin fallback copy fresh.
          gh workflow run pages.yml --ref main || echo "could not trigger pages.yml (non-fatal)"
